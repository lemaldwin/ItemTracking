spring:
  application:
    name: inventory
  datasource:
    url: jdbc:postgresql://${DB_HOSTNAME}:${DB_PORT:5432}/${DB_TABLE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

management:
  endpoint:
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - shutdown
  health:
    probes:
      enabled: true
